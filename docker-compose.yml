services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: booking_engine
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=dev-only-insecure-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://booking:booking_secret@db:5432/booking_engine
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn chapp.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
